<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .game-menu {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .game-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            width: 250px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            background: rgba(255, 255, 255, 0.2);
        }
        .game-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }
        .game-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .game-desc {
            font-size: 0.9rem;
            opacity: 0.8;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <h1>🎮 Game Hub 🎮</h1>
    <div class="game-menu">
        <a href="/snow" class="game-card">
            <div class="game-icon">⛄</div>
            <div class="game-title">Snow Stacking</div>
            <div class="game-desc">눈덩이를 쌓아 우주까지 닿아보세요!</div>
        </a>
        <a href="/galaxy" class="game-card">
            <div class="game-icon">🚀</div>
            <div class="game-title">Galaxy Defender</div>
            <div class="game-desc">우주를 지키는 최후의 영웅이 되어보세요!</div>
        </a>
    </div>
</body>
</html>
